name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  phase0-and-syntax:
    name: Phase 0 and JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: git ls-files -z -- '*.mjs' | xargs -0 -r -n1 node --check
      # Phase 0 uses controlled providers and loopback fixtures, without live credentials.
      # Full contained Phase 1 and browser proof remain separate local requirements.
      - name: Run Phase 0 tests
        run: npm run test:phase0
